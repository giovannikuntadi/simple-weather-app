<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <div class="search">
            <input type="text" placeholder="enter yor text" spellcheck="false">
            <button>
                <img src="images/search.png" alt="">
            </button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="weather">
            <img src="images/rain.png" alt="weather icon" class="weather-icon">
            <h1 class="temp">0°</h1>
            <h2 class="city">City Name</h2>
            
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity logo">
                    <div>
                        <p class="humidity">0 %</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/wind.png" alt="wind logo">
                    <div>
                        <p class="wind">0 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
